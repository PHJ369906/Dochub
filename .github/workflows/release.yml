name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Update version from tag
        working-directory: frontend
        shell: node {0}
        run: |
          const fs = require('fs')
          const tag = '${{ github.ref_name }}'
          const version = tag.replace(/^v/, '')

          const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'))
          tauriConf.version = version
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2))

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.version = version
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))

          console.log(`Version updated to ${version}`)

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'DocHub ${{ github.ref_name }}'
          releaseBody: |
            ## DocHub ${{ github.ref_name }}

            ### 下载说明
            - **macOS**（Apple Silicon / Intel 通用）：下载 `*_universal.dmg`
            - **Windows**：下载 `*_x64-setup.exe`

            ### 更新内容
            查看 [完整更新日志](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
